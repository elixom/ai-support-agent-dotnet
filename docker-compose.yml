services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_Secure_Password123!
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Your_Secure_Password123!", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=support_agent;User Id=sa;Password=Your_Secure_Password123!;Encrypt=False;TrustServerCertificate=True;
      - JWT_SECRET=super-secret-temporary-key-that-must-be-long-enough-for-hs256
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CLAUDE_HAIKU_MODEL=claude-3-haiku-20240307
      - CLAUDE_SONNET_MODEL=claude-3-5-sonnet-20241022
      - AZURE_AI_FOUNDRY_HAIKU_URL=${AZURE_AI_FOUNDRY_HAIKU_URL}
      - AZURE_AI_FOUNDRY_HAIKU_KEY=${AZURE_AI_FOUNDRY_HAIKU_KEY}
      - AZURE_AI_FOUNDRY_SONNET_URL=${AZURE_AI_FOUNDRY_SONNET_URL}
      - AZURE_AI_FOUNDRY_SONNET_KEY=${AZURE_AI_FOUNDRY_SONNET_KEY}
    ports:
      - "3000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mssql_data:
